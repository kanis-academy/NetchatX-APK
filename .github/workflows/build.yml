
name: Build NetchatX APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q NetchatX-APK-Project.zip -d extracted
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper introuvable"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$WRAPPER")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetchatX-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          
