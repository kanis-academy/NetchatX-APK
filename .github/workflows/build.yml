
name: Build NetchatX APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o NetchatX-APK-Project.zip -d extracted
          test -f extracted/package.json || {
            echo "ERREUR : package.json introuvable"
            exit 1
          }
          test -f extracted/android/settings.gradle || {
            echo "ERREUR : android/settings.gradle introuvable"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install dependencies
        working-directory: extracted
        run: npm install

      - name: Sync Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetchatX-APK
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
